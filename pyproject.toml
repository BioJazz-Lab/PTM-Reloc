[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ptmreloc"
version = "0.1.0"
description = "Prior-knowledge (PhosphoSitePlus) guided relocalization of low-confidence PTM sites on peptides"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Song Feng" }]
keywords = ["proteomics", "phosphoproteomics", "PTM", "phosphosite", "site localization",
            "AScore", "PhosphoSitePlus", "mass spectrometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.22", "pandas>=1.4", "scipy>=1.8"]

[project.optional-dependencies]
excel = ["openpyxl"]
parquet = ["pyarrow"]
test = ["pytest"]

[project.scripts]
ptmreloc = "ptmreloc.cli:main"

# Code only: the reference data (database/) is downloaded on first use, not packaged.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
